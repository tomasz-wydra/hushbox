name: DCO

# Checks that every commit in a pull request from a fork carries a
# "Signed-off-by:" line matching the commit author (see CONTRIBUTING.md).
# Pull requests opened from branches of this repository (maintainer work)
# are skipped.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off check
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%B' "$sha" | grep -Fqx "Signed-off-by: $author"; then
              echo "ok      $sha  $author"
            else
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off your commits with 'git rebase --signoff main' and force-push. See CONTRIBUTING.md."
            exit 1
          fi
