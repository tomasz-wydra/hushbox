[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushbox-core"
version = "0.9.0"
description = "E2E encryption core for Hushbox — NaCl keys, key file format, message envelope, QR payload, Ed25519 signatures, authenticated relay client"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "pynacl",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hushbox_core*"]
