[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hushbox-core"
version = "0.3.0"
description = "E2E encryption core for Hushbox — NaCl keys, chat store, relay transport"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pynacl",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hushbox_core*"]
